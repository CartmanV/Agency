<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A1F16" />
  <title>Экономика поддержки — направление «Агентства»</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <div data-header></div>

  <div class="crumbs"><a href="index.html">Направление</a> <span>›</span> Экономика поддержки</div>

  <main id="main">
    <!-- Шапка: eyebrow → H1 → лид. Тексты из support_econ_extra.json. -->
    <div data-se-head></div>

    <!-- B0. Первый экран: главное на странице целиком — плашки, выводы, запрос.
         Всё остальное ниже раскрывает по одному выводу отсюда. -->
    <div data-se-summary></div>

    <!-- B1. Панель управления: только база (всё направление / без IBC).
         Зарплата специалиста и показатель графика переехали внутрь денежного
         блока — они управляют только им. Состояние — в адресе страницы. -->
    <div data-se-controls></div>

    <!-- B2. Люди — главное ограничение направления, поэтому первым блоком. -->
    <h2 id="lyudi">Люди: сколько выдерживает поддержка</h2>
    <div data-se-capacity></div>

    <!-- B3. Кто создаёт нагрузку -->
    <h2 id="kto">Кто создаёт нагрузку</h2>
    <div data-se-who></div>

    <!-- B4. Потолок эффекта: сколько обращений в принципе не снять продуктом -->
    <h2 id="potolok">Сколько нагрузки вообще можно снять продуктом</h2>
    <div data-se-supplier></div>

    <!-- B5. Экономика по агентствам + разбор по клику на строку -->
    <h2 id="agentstva">Экономика по агентствам</h2>
    <div data-se-table></div>

    <!-- B6. Помесячная теплокарта -->
    <h2 id="pomesyachno">Помесячно по агентствам</h2>
    <div data-se-heat></div>

    <!-- B7. Что решить -->
    <h2 id="delat">Что решить</h2>
    <div data-se-actions></div>

    <!-- B8. Методика и оговорки. Якорь #znamenatel сохранён: на него ведут
         внешние ссылки с других страниц. Денежный блок живёт здесь же
         (якорь #dengi): в деньгах ограничения нет, и держать его выше
         значит спорить с главным выводом страницы. -->
    <h2 id="znamenatel">Что стоит за числами</h2>
    <div data-se-money></div>
    <div data-se-method></div>

    <!-- B9. Свежесть и окно данных -->
    <div data-se-footdata></div>
  </main>

  <div data-footer></div>

  <script src="assets/app.js"></script>
</body>
</html>
